# 本地提交钩子：只跑「秒级」检查，能自动修的直接修；修不掉的才拦下提交。
#
# 用 `pnpm exec` 而不是 `npx`：与 CI（pnpm install --frozen-lockfile
# --config.node-linker=hoisted）走同一棵树，且**不联网下载**。
#
# 必须带 `--config.verify-deps-before-run=false`：pnpm 默认会在 exec 之前校验依赖树，
# 而本机 pnpm 的 symlink 链接器会卡死（与 ci.yml 文件头记的是同一件事）。
# 实测不关掉时，每次钩子运行都会触发一次注定失败的隐式 `pnpm install`：
# 钩子红、并在仓根留下一个 _tmp_ 临时文件。关掉它，钩子只借用树里已有的
# prettier / eslint，不重装任何东西、不联网。
#
# 设计取舍：
#   - 只跑格式化与 lint（秒级）。typecheck / 构建 / 测试留给 ci.yml。
#   - 自动修复（--write / --fix）会让文件在工作树里变化，**需要重新 git add**。
#
# ⚠️ **下面 prettier 钩子的 `files:` 与 `package.json` 的 `format:check` glob
# 是两个家。** 它们漂开过一次：门禁那条原本只有 `{ts,json,md,yml,yaml}`，
# 比这里少 8 种（tsx / js / jsx / mjs / cjs / css / scss / html）—— 于是
# `.tsx` / `.css` 那批文件的格式**不在门禁里**，而 `pnpm check` 照样打印
# 「All matched files use Prettier code style!」并以 0 退出，没有任何信号。
# 改任何一处都要同时改另一处；判据 `tests/format-scope.test.ts` 钉住「门禁 ⊇ 钩子」。
#
# 启用（每个 clone 执行一次；pre-commit 本体用 `uv tool install pre-commit` 装到 ~/.local/bin）：
#   pre-commit install
# 全量跑一次：
#   pre-commit run --all-files
# 临时跳过：
#   git commit --no-verify
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier --write (pnpm exec)
        entry: pnpm --config.verify-deps-before-run=false exec prettier --write
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|html|yml|yaml|md)$
        exclude: ^(node_modules/|lib/|调研报告归档/|pnpm-lock\.yaml$)
        require_serial: true

      - id: eslint
        name: eslint --fix (pnpm exec)
        entry: pnpm --config.verify-deps-before-run=false exec eslint --fix
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$
        exclude: ^(node_modules/|lib/|eslint\.config\.js$)
        require_serial: true

# 日常 CI：推 main 与每个 PR 都跑类型检查、构建与测试。
#
# 只读：`permissions: contents: read`，不写回仓库。
#
# 安装固定加 `--config.node-linker=hoisted`：本机 pnpm 11 的 symlink 链接器会卡死，
# CI 用同一种布局，两边装出来的才是同一棵树。
#
# `--frozen-lockfile` 是那条「锁文件与清单必须同步」的守卫：对不上直接失败。
#
# 平台：单平台。本仓的运行时是 Windows（CPA 以 .exe + .dll 形式提供），
# 但这一层代码里没有平台专属的编译期分支 —— 平台相关的行为（进程托管、注册表读代理）
# 都在运行期判定，且靠真机验收覆盖。等有打真实平台 API 的测试再扩矩阵。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    # 整轮上限。默认 6 小时：一旦有步骤挂住（不是失败，是不返回），
    # 不设限就等于白占一个 runner 半天。本仓全量约 1 分钟。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          # 版本基线以 .node-version 为唯一来源，避免 CI 与本机漂移。
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      # 两半各跑一次 —— 它们有不同的 lib/types，合成一次会互相污染。
      - name: Typecheck (host)
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (client)
        run: pnpm exec tsc --noEmit -p tsconfig.client.json

      - name: Lint
        run: pnpm exec eslint .

      # 分层依赖检查：浏览器引宿主、判据碰 IO、契约层混入值依赖都不报错，
      # 只会静默烂掉 —— 所以放在门禁上，与 `pnpm check` 跑同一份脚本。
      - name: Check layering
        run: pnpm check:layering

      # 文档里的路径检查：搬文件 / 改名 / 删模块之后，代码里的旧路径当场编译报错，
      # 文档里的旧路径**零信号** —— 只有人恰好翻到那一句才发现。同一个脚本在
      # `pnpm check` 里也跑，这里单独列出来是为了让红的那一步一眼看得出是文档的问题。
      - name: Check doc paths
        run: pnpm check:doc-paths

      # 格式门禁与本地**同源**：跑 `pnpm format:check`，不在这里手抄一份扩展名清单。
      #
      # ⚠️ 手抄过一次，抄漏了 8 种（tsx / js / jsx / mjs / cjs / css / scss / html）——
      # 于是 **CI 全绿而本地 `pnpm check` 红**：两边对「门禁」的定义不同，而 CI 才是
      # 合入前真正看的那一个。清单的唯一 home 是 package.json 的 format / format:check；
      # `tests/format-scope.test.ts` 钉住它罩得住本地钩子，且这里不再长出第三份。
      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm build

      # 产物断言：这两条是「构建成功 ≠ 插件能用」的兜底 ——
      # `inject` 少一个插件挂不上且**不报错**；缺了导出，宿主静默不显示。
      # 断言集合住在仓内脚本里（与 `pnpm check` 用的是同一份），避免两处漂移。
      - name: Verify build artifacts
        run: pnpm verify:artifacts

      - name: Test
        run: pnpm test

  # 收口 job —— ruleset 的 required_status_checks 只配这一个名字（CI Success），
  # 本文件内部的 job 增删时规则集无需改动。
  #
  # ⚠️ 改本 job 前必读三条，每一条都对应一种**假绿**：
  #   1. 判定只放 **step 级**。放 job 级时条件为假会让本 job 变 `skipped`，
  #      而 GitHub 把 `skipped` 当 Success —— 那正是这里要防的东西。
  #   2. `needs` 必须列全本文件**所有** job id。漏一个，那个 job 红了也照样放行。
  #   3. `skipped` 一并判红。本 workflow 没有合法的 `if:` 跳过，出现 `skipped`
  #      只可能是上游失败级联（上游同在 `needs` 里，会同时判红）。
  #
  # 判据：`tests/ci-closing-job.test.ts`（含反向控制）。
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::有 job 未成功 —— CI Success 判红（原因见本 job 上方注释）"
          echo '${{ toJSON(needs) }}'
          exit 1

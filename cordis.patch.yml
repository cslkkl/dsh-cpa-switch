# dsh-cpa-switch bundle patch —— 把本插件作为一行插入 dsh profile。
#
# 格式对齐 DSH 官方 bundle patch：顶层是 loader patch 条目数组；
# `insert` 在 profile 根上追加插件行。
#
# 模型路由**不在这里声明**：由插件运行时注册（见文件末尾说明），
# 随包静态清单会漂移、且与端口耦合，已废弃。
#
# name 必须是 loader 能从 profile 的 node_modules 解析到的模块 id，即本包自身的包名。
- insert:
    - id: dsh-cpa-switch
      name: dsh-cpa-switch
#
# ── CPA 中转站模型路由 ──────────────────────────────────────────────────
#
# 模型路由**不再随包静态声明**，由插件在运行时注册：
# CPA 就绪后，插件把实时模型目录（/v1/models + 渠道归属）以
# `providers.cpa` 推给本组合里休眠的 `llm-pi-ai`（volatile 配置字段，
# 原子重注册路由，不重启、不写盘）。没有账号时目录为空，路由不存在 ——
# 加完账号，模型自动出现在对话模型选择器里。
#
# 因此：baseURL 跟随插件配置的 `port`（不再写死 8317）；
# 模型目录随账号增减自动跟随（不再漂移）；调用密钥仍走凭据引用
# `CPA_API_KEY`（插件启动时自动备好）。

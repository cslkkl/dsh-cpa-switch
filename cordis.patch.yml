# dsh-cpa-switch bundle patch —— 把本插件作为一行插入 dsh profile。
#
# 格式对齐 DSH 官方 bundle patch：顶层是 loader patch 条目数组；
# `insert` 在 profile 根上追加插件行。
#
# name 必须是 loader 能从 profile 的 node_modules 解析到的模块 id，即本包自身的包名。
- insert:
    - id: dsh-cpa-switch
      name: dsh-cpa-switch
#
# ── CPA Switch 路由骨架 ─────────────────────────────────────────────────
#
# **为什么骨架在这里，而模型清单不在**：任何设置写入（切语言、改主题、存模型页配置…）
# 都会触发 `reconcileProfilePatches`，它整体替换 Include 的 patches
# （`app-boot/src/index.ts:289`），下游 fiber 全部 dispose + 重建。
# 重建后从这份 patch 基线重新解析配置 —— **运行时注入的 volatile 值会随之消失**。
# 骨架声明成静态的，重载后路由仍在；只有模型清单需要插件重推。
#
# 这个行属于 `llm-pi-ai` 而不是本插件：bundle patch 与用户 patch 是同一个扁平
# `PatchOptions[]`，无「只能改自己那行」的限制。
#
# **为什么不写 baseURL**：它含用户可配的端口，写死会与设置不符；而且
# `llm-pi-ai/src/provider.ts:145` 明确 provider 级 `baseURL` 只是展示元数据，
# 实际请求走 `Model.baseUrl`（由 models 解析出来）。
#
# **为什么不写 models**：省略是合法的（`llm-pi-ai/src/config.ts:470` 只在
# `source.models !== undefined` 时才传入）。骨架 + 空清单是合法状态：
# 路由存在、模型列表暂空，插件就绪后补上。
#
# **为什么是四行（一个渠道一个 provider）**：模型选择器**按 provider 分组**，
# 四个渠道原先共用一行 `cpa` —— 模型一多就是一层平铺（实测 96 行）。
# 拆成四行之后分组常驻，重载空窗里也不会整组消失。
#
# ⚠️ **这一层会被「同 id 的用户行」整行吃掉**（2026-10-19 实机）：
# 用户 profile 的 `cordis.patch.yml` 若也写了 `- id: llm-pi-ai`（很常见 —— 有人在那里
# 声明自己的 provider），**后层整行替换、不深合并** ⇒ 下面这四行**根本不生效**，
# provider 只能靠插件运行时推；而推有三个空窗（装配时条目未出现、`boot` 链要等 CPA、
# 设置写入重建 fiber），窗口里发消息就报 `no adapter registered for provider`。
# 所以**覆盖了这个 id 的那份 patch 必须自己把四行骨架抄过去**（`models` 可省略），
# 建议用 `# >>> cpa-switch 骨架` / `# <<< cpa-switch 骨架` 首尾标记圈住，便于人工与脚本识别。
#
# ⚠️ 键名与组名由 `src/channels/registry.ts` 的 `providerIdOf` / `providerLabelOf`
# 派生，这里是手抄的副本（YAML 无法 import TS）—— 由
# `tests/route-registry.test.ts` 的「骨架与推送的分组一致」钉住两者相等。
- id: llm-pi-ai
  config:
    providers:
      cpa-workbuddy:
        displayName: CPA Switch · WorkBuddy
        apiKeyEnv: CPA_API_KEY
        api: openai-completions
      cpa-trae:
        displayName: CPA Switch · Trae
        apiKeyEnv: CPA_API_KEY
        api: openai-completions
      cpa-qoder:
        displayName: CPA Switch · Qoder
        apiKeyEnv: CPA_API_KEY
        api: openai-completions
      cpa-zcode:
        displayName: CPA Switch · ZCode
        apiKeyEnv: CPA_API_KEY
        api: openai-completions

# dsh-cpa-switch bundle patch —— 把本插件作为一行插入 dsh profile，
# 并顺带声明 CPA 中转站的模型路由，让用户装完就能在对话里直接选到模型。
#
# 格式对齐 DSH 官方 bundle patch：顶层是 loader patch 条目数组。
# `insert` 在 profile 根上追加插件行；带 `id` 的条目按 id 命中已有行。
#
# ⚠️ 两条 Loader 语义决定了下面必须这么写（见 skill `cordis-composition-reference`）：
#  1. 带 `id` 的补丁**整体替换**目标行的 `config`，从不深合并 ——
#     所以 `providers` 下用到的字段要一次写全。
#  2. 命中不到目标行的补丁会被**警告并跳过**，不报错 ——
#     `llm-pi-ai` 由 `@deepseek-ai/dsh-base` 提供，所有 profile 都有这一行。
#
# 层序：bundle 补丁在前，profile 自己的 `cordis.patch.yml` 在后。
# 所以用户若自己配过 `llm-pi-ai`，以用户那份为准，这里不覆盖他的选择。
#
# name 必须是 loader 能从 profile 的 node_modules 解析到的模块 id，即本包自身的包名。
- insert:
    - id: dsh-cpa-switch
      name: dsh-cpa-switch

# ── CPA 中转站模型路由 ──────────────────────────────────────────────────
# dsh-base 把 `llm-pi-ai` 挂在休眠姿态：没有任何 provider 时不注册路由。
# 这里补上 provider，路由即注册生效 —— 用户不需要手改任何配置文件。
#
# 密钥走凭据引用 `CPA_API_KEY`，插件启动时会自动备好这条凭据，
# 因此本文件不含密钥值。删掉本段，路由即消失。
#
# 下列模型是**实测筛过的可用集**，不是 CPA 报出来的全集：
# CPA 的 `/models/groups` 会报出上游不认的模型，`owned_by` 也有相当比例是错的，
# 照搬会得到「列表里看得见、一点就报错」。这里是逐个实发请求验过的 49 个
# （WorkBuddy 19 / Trae 15 / Qoder 13 / ZCode 2）。
# 名称前缀标出渠道 —— 只加了某个渠道账号的用户据此挑选。
#
# ⚠️ baseURL 与插件配置项 `port` 耦合，固定在默认端口 8317。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      cpa:
        displayName: "CPA 中转站"
        api: openai-completions
        baseURL: http://127.0.0.1:8317/v1
        apiKeyEnv: CPA_API_KEY
        models:
          - id: minimax-m3
            name: "WorkBuddy · minimax-m3"
            input: [ text, image ]
          - id: deepseek-v4-flash
            name: "WorkBuddy · deepseek-v4-flash"
            input: [ text, image ]

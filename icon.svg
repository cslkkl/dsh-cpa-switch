<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    dsh-cpa-switch 的插件页图标（过渡版，非最终设计）。

    方向：人物 + 环绕切换箭头 —— 人物是账号，箭头是「同一渠道里切换账号」。

    几何：源图按 24 格画，墨迹外接框实测 2.6–21.4（边长 18.8，含 1.8 描边），
    整组用 translate(3.957447 3.979681) scale(1.1702127660) 搬进官方 36 格 ——
    缩放后墨迹正好占 7–29，四周各留 7，落在官方边距窗口（6–9）内。

    颜色是烘死的 #6B7280：宿主按图片渲染，主题变量与继承色都不起作用。
    中性灰在亮暗两张主题表里都看得清，且不与状态色语义撞车。

    注意：XML 注释里不许出现连续两个连字符 —— 浏览器会当图片解析失败，
    插件页静默回落成默认图形，没有任何报错。
  -->
  <g transform="translate(3.957447 3.979681) scale(1.1702127660)">
    <path d="M20.5 12a8.5 8.5 0 1 1-3-6.5"
          stroke="#6B7280" stroke-width="1.8"
          stroke-linecap="round"/>
    <path d="M20.5 5.5v3.5h-3.5"
          stroke="#6B7280" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="10" r="2.5" fill="#6B7280"/>
    <path d="M7.1 17.8C7.1 15.3 9.3 13 12 13s4.9 2.3 4.9 4.8"
          stroke="#6B7280" stroke-width="1.8"
          stroke-linecap="round"/>
  </g>
</svg>

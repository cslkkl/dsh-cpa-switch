<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    dsh-cpa-switch 的插件页图标。

    方向：人物 + 环绕切换箭头 —— 人物是账号，箭头是「同一渠道里切换账号」。

    为什么是「实心蓝盘 + 反白人物 + 反白箭头」，而不是细线灰环：
    宿主行内图标只画 30px、卡片 36px（dsh-client-ui-plugin-manager 的
    ROW_ARTWORK_SIZE / CARD_ARTWORK_SIZE），而同一排里官方插件图标都是**实心彩色**的
    （蓝渐变盾牌、蓝勾、蓝圈）。细线灰环在那个尺寸下糊成一段「C」，还会被读成「已禁用」；
    实心盘的外轮廓本身就是一块实心，30px 下不散，也是这一排里最稳的读法。

    几何：整块就是一枚 r=11 的圆盘、圆心 (18,18) —— 外轮廓正好落在官方 36 格的
    墨迹窗口 7–29 上（四周各留 7），因此不再需要内层 transform。
    盘面是 #5C8EFF → #2A55D0 的竖向渐变（与官方插件同一族的蓝）。

    白箭头：半径 8.0 的圆弧，从 φ=210° 绕过头顶到 φ=25°（顺时针，盖过 185°），
    线宽 2.9、圆头帽；φ=25° 处接一枚实心三角箭头（底距尖端 4.4、半宽 2.05），指向顺时针。
    两端都收在肩膀附近 —— 读起来是「绕着他转」，而不是「浮着一段弧」。
    白人物：头 r=2.9 圆心 (18,16.1)；肩宽 10.0、底边 y=24.4、隆起顶点 y=20.0。
    箭头内缘（半径 6.55）到肩角（离心 7.36）之间留一点负空间，别再放宽肩膀。

    注意：XML 注释里不许出现连续两个连字符 —— 浏览器会当图片解析失败，
    插件页静默回落成默认图形，没有任何报错。
  -->
  <defs>
    <linearGradient id="a" x1="18" y1="7" x2="18" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5C8EFF"/>
      <stop offset="1" stop-color="#2A55D0"/>
    </linearGradient>
  </defs>
  <circle cx="18" cy="18" r="11" fill="url(#a)"/>
  <path d="M11.07 22A8 8 0 1 1 25.25 14.62"
        stroke="#FFFFFF" stroke-width="2.9" stroke-linecap="round"/>
  <path d="M25.25 14.62L25.25 9.76L21.53 11.5Z" fill="#FFFFFF"/>
  <circle cx="18" cy="16.1" r="2.9" fill="#FFFFFF"/>
  <path d="M13 24.4c0-2.38 2.7-4.4 5-4.4s5 2.3 5 4.4Z" fill="#FFFFFF"/>
</svg>
